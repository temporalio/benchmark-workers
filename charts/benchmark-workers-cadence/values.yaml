# Default values for benchmark-workers-cadence chart
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/temporalio/benchmark-workers-cadence
  # Default to appVersion from Chart.yaml
  tag: ""
  pullPolicy: Always

cadence:
  grpcEndpoint: "cadence-frontend.cadence:7833"
  domain: "default"
  taskList: "benchmark"
  # Fixed poller counts (Cadence has no poller auto-scaling). Unset = SDK default.
  # maxDecisionTaskPollers: "150"
  # maxActivityTaskPollers: "150"

  tls:
    enabled: false
    # Provide these values or use an existing Secret
    key: ""
    cert: ""
    ca: ""
    disableHostVerification: false
    
    # If using an existing secret, specify the name
    existingSecret: ""

metrics:
  enabled: true
  # The port to expose metrics on
  port: 9090
  # The Prometheus endpoint path and listening address
  prometheusEndpoint: ":9090"
  # Headless service configuration
  service:
    annotations: {}
  # ServiceMonitor configuration for Prometheus Operator
  serviceMonitor:
    enabled: true
    # Additional labels to add to the ServiceMonitor
    additionalLabels: {}
    # Scrape interval
    interval: 15s
    # Scrape timeout
    scrapeTimeout: 10s

workers:
  # Number of worker replicas
  replicaCount: 1
  # Resources configuration
  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 1Gi
    # requests:
    #   cpu: 500m
    #   memory: 512Mi

# Additional environment variables for worker pods
additionalEnv: []
  # - name: CUSTOM_SETTING
  #   value: "my-value"
  # - name: DATABASE_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: password

soakTest:
  enabled: true
  # Number of soak test replicas
  replicaCount: 1
  concurrentWorkflows: "10"
  workflowType: "ExecuteActivity"
  workflowArgs: '{ "Count": 3, "Activity": "Echo", "Input": { "Message": "test" } }'
  # Resources configuration
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 200m
    #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {} 