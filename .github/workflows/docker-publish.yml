name: Docker
on:
  push:
    branches: ["cadence"]
    # Cadence releases use a distinct tag prefix. Git tags share one namespace
    # across the whole repo, so this avoids colliding with the Temporal `v*`
    # release tags on main. The two filters are disjoint: `cadence-v*` never
    # matches `v*.*.*` and vice versa, so each tag triggers exactly one workflow.
    tags: ['cadence-v*.*.*']
  pull_request:
    branches: ["cadence"]
env:
  REGISTRY: ghcr.io
  # Published distinctly from the Temporal image so the two can coexist.
  IMAGE_NAME: temporalio/benchmark-workers-cadence
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strip the `cadence-v` prefix so release tag cadence-v1.2.3 produces
          # image tags 1.2.3 / 1.2 / 1 / latest. Branch pushes produce `cadence`.
          tags: |
            type=match,pattern=cadence-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=cadence-v(\d+\.\d+),group=1
            type=match,pattern=cadence-v(\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/cadence-v') }}
            type=ref,event=branch
            type=ref,event=pr
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
